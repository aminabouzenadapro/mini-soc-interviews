<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini SOC Research</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Mini SOC Research</div>
    <div class="top-actions">

        <button id="lang-en" type="button" data-action="uiLang" data-lang="en">EN</button>
        <button id="lang-fr" type="button" data-action="uiLang" data-lang="fr">FR</button>
      </div>
      <button class="btn quiet" id="signout" type="button" data-action="signOut" hidden></button>
    </div>
  </header>
  <nav class="nav" id="nav" hidden></nav>
  <main class="main" id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
